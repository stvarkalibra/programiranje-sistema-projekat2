apiVersion: 1

datasources:
  # Loki
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      maxLines: 1000

  # MySQL za Booking servis (Zorana)
  - name: MySQL-Booking
    type: mysql
    access: proxy
    url: db-mysql:3306
    user: root
    database: eco_tourism_db
    secureJsonData:
      password: root
    jsonData:
      sslmode: "disable"

  # MySQL za Accommodation servis (Anja)
  - name: MySQL-Accommodation
    type: mysql
    access: proxy
    url: db-mysql:3306
    user: root
    database: eco_tourism_db
    secureJsonData:
      password: root
    jsonData:
      sslmode: "disable"