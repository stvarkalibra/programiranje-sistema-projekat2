services:

  config-service:
    build: ./config-service
    container_name: config-cont
    ports:
      - "8888:8888"
    networks:
      - backend-network
      - frontend-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8888/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s

  db-mysql:
    image: mysql:8.0
    container_name: mysql-db
    environment:
      MYSQL_DATABASE: eco_tourism_db
      MYSQL_ROOT_PASSWORD: root
    #    ports:
    #      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - frontend-network
      - backend-network

  auth-service:
    build: ./auth-service
    container_name: auth-cont
    environment:
      - CONFIG_SERVER_URL=http://config-service:8888
      - SERVER_PORT=8085
      - SPRING_DATASOURCE_URL=jdbc:mysql://db-mysql:3306/eco_tourism_db?createDatabaseIfNotExist=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - GATEWAY_URL=http://localhost:8080
    depends_on:
      db-mysql:
        condition: service_healthy
      config-service:
        condition: service_healthy
    networks:
      - backend-network

  discovery-service:
    build:
      context: .
      dockerfile: discovery-service/Dockerfile
    container_name: discovery-cont
    ports:
      - "8761:8761"
    environment:
      - SERVER_PORT=8761
    healthcheck:
      test: [ "CMD-SHELL", "wget -q --spider http://localhost:8761/actuator/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s
    networks:
      - backend-network
      - frontend-network

  zipkin:
    image: openzipkin/zipkin:latest
    container_name: zipkin-server
    ports:
      - "9411:9411"
    networks:
      - backend-network
      - frontend-network
    # Opciono: kontejner se sam restartuje ako pukne
    restart: always

  loki:
    image: grafana/loki:2.9.8
    container_name: loki-cont
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - backend-network
      - frontend-network

  grafana:
    image: grafana/grafana:latest
    container_name: grafana-cont
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - loki
    networks:
      - backend-network
      - frontend-network

  gateway-service:
    build: ./gateway-service
    container_name: gateway-cont
    ports:
      - "8080:8080"
    environment:
      - CONFIG_SERVER_URL=http://config-service:8888
      - SERVER_PORT=8080
      - BOOKING_SERVICE_URL=http://booking-service:8083
      - FINANCES_SERVICE_URL=http://finances-service:8084
      - GUIDE_SERVICE_URL=http://guide-service:8087
      - AVANTURA_SERVICE_URL=http://avantura-service:8088
      - ACCOMMODATION_SERVICE_URL=http://accommodation-service:8081
      - MAINTENANCE_SERVICE_URL=http://maintenance-service:8082
      - AUTH_SERVICE_URL=http://auth-service:8085
      - EUREKA_URL=http://discovery-service:8761/eureka
    depends_on:
      config-service:
        condition: service_healthy
      auth-service:
        condition: service_started
      booking-service:
        condition: service_started
      finances-service:
        condition: service_started
      guide-service:
        condition: service_started
      avantura-service:
        condition: service_started
      accommodation-service:
        condition: service_started
      maintenance-service:
        condition: service_started
      discovery-service:
        condition: service_healthy
      loki:
        condition: service_started
    networks:
      - frontend-network
      - backend-network

  booking-service:
    build:
      context: .
      dockerfile: booking-service/Dockerfile
    container_name: booking-cont
    environment:
      - CONFIG_SERVER_URL=http://config-service:8888
      - SPRING_DATASOURCE_URL=jdbc:mysql://db-mysql:3306/eco_tourism_db?createDatabaseIfNotExist=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - SPRINGDOC_SERVER_URL=http://localhost:8080
      - GATEWAY_URL=http://localhost:8080
      - ACCOMMODATION_SERVICE_URL=http://accommodation-service:8081
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_PORT=5672
      - SPRING_RABBITMQ_USERNAME=guest
      - SPRING_RABBITMQ_PASSWORD=guest
    depends_on:
      db-mysql:
        condition: service_healthy
      config-service:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      accommodation-service:
        condition: service_started
    networks:
      - backend-network

  finances-service:
    build:
      context: .
      dockerfile: finances-service/Dockerfile
    container_name: finances-cont
    environment:
      - CONFIG_SERVER_URL=http://config-service:8888
      - SPRING_DATASOURCE_URL=jdbc:mysql://db-mysql:3306/eco_tourism_db?createDatabaseIfNotExist=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - SPRINGDOC_SERVER_URL=http://localhost:8080
      - GATEWAY_URL=http://localhost:8080
      - BOOKING_SERVICE_URL=http://booking-service:8083
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_PORT=5672
      - SPRING_RABBITMQ_USERNAME=guest
      - SPRING_RABBITMQ_PASSWORD=guest
    depends_on:
      db-mysql:
        condition: service_healthy
      config-service:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      booking-service:
        condition: service_started
    networks:
      - backend-network

  guide-service:
    build:
      context: .
      dockerfile: guide-service/Dockerfile
    container_name: guide-cont
    environment:
      - CONFIG_SERVER_URL=http://config-service:8888
      - SERVER_PORT=8087
      - SPRING_DATASOURCE_URL=jdbc:mysql://db-mysql:3306/eco_tourism_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - GATEWAY_URL=http://localhost:8080
      - AVANTURA_SERVICE_URL=http://avantura-service:8088
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_PORT=5672
      - SPRING_RABBITMQ_USERNAME=guest
      - SPRING_RABBITMQ_PASSWORD=guest
      - EUREKA_URL=http://discovery-service:8761/eureka
    depends_on:
      db-mysql:
        condition: service_healthy
      config-service:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      avantura-service:
        condition: service_started
      discovery-service:
        condition: service_healthy
      loki:
        condition: service_started
    networks:
      - backend-network

  avantura-service:
    build:
      context: .
      dockerfile: avantura-service/Dockerfile
    environment:
      - CONFIG_SERVER_URL=http://config-service:8888
      - SERVER_PORT=8088
      - SPRING_DATASOURCE_URL=jdbc:mysql://db-mysql:3306/eco_tourism_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - GATEWAY_URL=http://localhost:8080
      - EUREKA_URL=http://discovery-service:8761/eureka
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_PORT=5672
      - SPRING_RABBITMQ_USERNAME=guest
      - SPRING_RABBITMQ_PASSWORD=guest
    depends_on:
      db-mysql:
        condition: service_healthy
      config-service:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      loki:
        condition: service_started
    networks:
      - backend-network

  accommodation-service:
    build:
      context: .
      dockerfile: accommodation-service/Dockerfile
    container_name: accommodation-cont
    environment:
      - CONFIG_SERVER_URL=http://config-service:8888
      - SPRING_DATASOURCE_URL=jdbc:mysql://db-mysql:3306/eco_tourism_db?createDatabaseIfNotExist=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
      - SPRING_DATASOURCE_DRIVER=com.mysql.cj.jdbc.Driver
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - SPRINGDOC_SERVER_URL=http://localhost:8080
      - GATEWAY_URL=http://localhost:8080
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_PORT=5672
      - SPRING_RABBITMQ_USERNAME=guest
      - SPRING_RABBITMQ_PASSWORD=guest
    depends_on:
      db-mysql:
        condition: service_healthy
      config-service:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - backend-network


  maintenance-service:
    build:
      context: .
      dockerfile: maintenance-service/Dockerfile
    container_name: maintenance-cont
    environment:
      - CONFIG_SERVER_URL=http://config-service:8888
      - SPRING_DATASOURCE_URL=jdbc:mysql://db-mysql:3306/eco_tourism_db?createDatabaseIfNotExist=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
      - SPRING_DATASOURCE_DRIVER=com.mysql.cj.jdbc.Driver
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - ACCOMMODATION_SERVICE_URL=http://accommodation-service:8081
      - SPRINGDOC_SERVER_URL=http://localhost:8080
      - GATEWAY_URL=http://localhost:8080
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_PORT=5672
      - SPRING_RABBITMQ_USERNAME=guest
      - SPRING_RABBITMQ_PASSWORD=guest
    depends_on:
      db-mysql:
        condition: service_healthy
      config-service:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      accommodation-service:
        condition: service_started
    networks:
      - backend-network

  adminer:
    image: adminer
    container_name: adminer-cont
    ports:
      - "8085:8080"
    networks:
      - frontend-network
      - backend-network

networks:
  frontend-network:
    driver: bridge

  backend-network:
    driver: bridge

volumes:
  mysql_data:
  grafana_data: