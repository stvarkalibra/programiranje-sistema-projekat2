services:

  config-service:
    build: ./config-service
    container_name: config-cont
    ports:
      - "8888:8888"
    networks:
      - micro-network

  db-mysql:
    image: mysql:8.0
    container_name: mysql-db
    environment:
      MYSQL_DATABASE: eco_tourism_db
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - micro-network

  auth-service:
    build: ./auth-service
    container_name: auth-cont
    ports:
      - "8086:8085"
    environment:
      - CONFIG_SERVER_URL=http://config-service:8888
      - SERVER_PORT=8085
      - SPRING_DATASOURCE_URL=jdbc:mysql://db-mysql:3306/eco_tourism_db?createDatabaseIfNotExist=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - GATEWAY_URL=http://localhost:8080
    depends_on:
      db-mysql:
        condition: service_healthy
      config-service:
        condition: service_started
    networks:
      - micro-network

  gateway-service:
    build: ./gateway-service
    container_name: gateway-cont
    ports:
      - "8080:8080"
    environment:
      - CONFIG_SERVER_URL=http://config-service:8888
      - SERVER_PORT=8080
      - BOOKING_SERVICE_URL=http://booking-service:8083
      - FINANCES_SERVICE_URL=http://finances-service:8084
      - GUIDE_SERVICE_URL=http://guide-service:8087
      - AVANTURA_SERVICE_URL=http://avantura-service:8088
      - ACCOMMODATION_SERVICE_URL=http://accommodation-service:8081
      - MAINTENANCE_SERVICE_URL=http://maintenance-service:8082
      - AUTH_SERVICE_URL=http://auth-service:8085
    depends_on:
      config-service:
        condition: service_started
      auth-service:
        condition: service_started
      booking-service:
        condition: service_started
      finances-service:
        condition: service_started
      guide-service:
        condition: service_started
      avantura-service:
        condition: service_started
      accommodation-service:
        condition: service_started
      maintenance-service:
        condition: service_started
    networks:
      - micro-network

  booking-service:
    build: ./booking-service
    container_name: booking-cont
    environment:
      - CONFIG_SERVER_URL=http://config-service:8888
      - SPRING_DATASOURCE_URL=jdbc:mysql://db-mysql:3306/eco_tourism_db?createDatabaseIfNotExist=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - SPRINGDOC_SERVER_URL=http://localhost:8080
      - GATEWAY_URL=http://localhost:8080
    depends_on:
      db-mysql:
        condition: service_healthy
      config-service:
        condition: service_started
    networks:
      - micro-network

  finances-service:
