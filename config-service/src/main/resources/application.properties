spring.application.name=config-service
#server.port=8888
server.port=${SERVER_PORT:8888}

# Putanja do repozitorijuma
spring.cloud.config.server.git.uri=https://github.com/RAF-PS-2025-26-P2/ps-project2-2025-26-tim_4.git
# Putanja do foldera unutar repozitorijuma
spring.cloud.config.server.git.search-paths=config_repo
# Branch
#spring.cloud.config.server.git.default-label=main
spring.cloud.config.server.git.default-label=feature3-kimi/dokerizacija
#spring.cloud.config.server.git.default-label=auth-service
# Git optimizacije
spring.cloud.config.server.git.clone-on-start=true
spring.cloud.config.server.git.force-pull=true
spring.cloud.config.server.git.refresh-rate=3
spring.cloud.config.server.health.enabled=true

spring.cloud.config.server.git.username=<REDACTED>
spring.cloud.config.server.git.password=<REDACTED>
