spring.application.name=maintenance-service
server.port=8082

spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}

# MySQL (override-uje se iz Docker env varijabli)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:maintenancedb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:create-drop}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

springdoc.swagger-ui.path=/swagger-ui.html

# URL accommodation servisa - Docker ime servisa umjesto localhost
accommodation.service.url=${ACCOMMODATION_SERVICE_URL:http://localhost:8081}

# Circuit Breaker
resilience4j.circuitbreaker.instances.accommodationService.sliding-window-size=10
resilience4j.circuitbreaker.instances.accommodationService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.accommodationService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.accommodationService.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.accommodationService.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.accommodationService.register-health-indicator=true

# Retry
resilience4j.retry.instances.accommodationService.max-attempts=3
resilience4j.retry.instances.accommodationService.wait-duration=2s
resilience4j.retry.instances.accommodationService.retry-exceptions=java.io.IOException,java.lang.RuntimeException

management.endpoints.web.exposure.include=health,info,circuitbreakers,retries
management.endpoint.health.show-details=always
management.health.circuitbreakers.enabled=true

logging.pattern.console=%d{HH:mm:ss} [%X{traceId}] %-5level %logger{36} - %msg%n