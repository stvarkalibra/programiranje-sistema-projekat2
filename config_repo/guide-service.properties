server.port=8087
springdoc.api-docs.path=/api/guides/v3/api-docs

spring.datasource.url=jdbc:h2:mem:guidedb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=kimi
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

springdoc.swagger-ui.path=/swagger-ui.html

resilience4j.retry.instances.retry.max-attempts=3
resilience4j.retry.instances.retry.wait-duration=2s

resilience4j.circuitbreaker.instances.circuitbreaker.register-health-indicator=true
resilience4j.circuitbreaker.instances.circuitbreaker.sliding-window-size=5
resilience4j.circuitbreaker.instances.circuitbreaker.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.circuitbreaker.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.circuitbreaker.permitted-number-of-calls-in-half-open-state=3

management.endpoints.web.exposure.include=health,circuitbreakers
management.health.circuitbreakers.enabled=true

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [%X{traceId}] %logger{36} - %msg%n