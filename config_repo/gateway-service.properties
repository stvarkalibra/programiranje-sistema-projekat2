server.port=${SERVER_PORT:8080}

spring.cloud.gateway.server.webflux.routes[0].id=accommodation-service
spring.cloud.gateway.server.webflux.routes[0].uri=${ACCOMMODATION_SERVICE_URL:http://accommodation-service:8081}
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/accommodation/**
spring.cloud.gateway.server.webflux.routes[0].filters[0]=RewritePath=/api/accommodation/(?<segment>.*), /${segment}

spring.cloud.gateway.server.webflux.routes[1].id=maintenance-service
spring.cloud.gateway.server.webflux.routes[1].uri=${MAINTENANCE_SERVICE_URL:http://maintenance-service:8082}
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/maintenance/**
spring.cloud.gateway.server.webflux.routes[1].filters[0]=RewritePath=/api/maintenance/(?<segment>.*), /${segment}

spring.cloud.gateway.server.webflux.routes[2].id=booking-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://booking-service
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/booking/**,/api/bookings/**,/api/guests/**,/api/add-on-items/**,/api/booking-status-logs/**,/api/cancellation-policies/**

spring.cloud.gateway.server.webflux.routes[3].id=finances-service
spring.cloud.gateway.server.webflux.routes[3].uri=lb://finances-service
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/finances/**,/api/invoices/**,/api/payment-methods/**,/api/tax-rates/**,/api/transactions/**

spring.cloud.gateway.server.webflux.routes[4].id=guide-service
spring.cloud.gateway.server.webflux.routes[4].uri=lb://guide-service
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/guides/**,/api/languages/**,/api/guide-languages/**,/api/certifications/**

spring.cloud.gateway.server.webflux.routes[5].id=avantura-service
spring.cloud.gateway.server.webflux.routes[5].uri=lb://avantura-service
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/api/adventures/**,/api/reviews/**,/api/categories/**,/api/gear/**,/api/time-slots/**

spring.cloud.gateway.server.webflux.globalcors.add-to-idp-col-mappings=true
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedOrigins=*
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedMethods=*
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedHeaders=*

springdoc.swagger-ui.urls[0].name=Accommodation Service
springdoc.swagger-ui.urls[0].url=/api/accommodation/v3/api-docs

springdoc.swagger-ui.urls[1].name=Maintenance Service
springdoc.swagger-ui.urls[1].url=/api/maintenance/v3/api-docs

springdoc.swagger-ui.urls[2].name=Booking Service
springdoc.swagger-ui.urls[2].url=/api/booking/v3/api-docs

springdoc.swagger-ui.urls[3].name=Finances Service
springdoc.swagger-ui.urls[3].url=/api/finances/v3/api-docs

springdoc.swagger-ui.urls[4].name=Guide Service
springdoc.swagger-ui.urls[4].url=/api/guides/v3/api-docs

springdoc.swagger-ui.urls[5].name=Adventure Service
springdoc.swagger-ui.urls[5].url=/api/adventures/v3/api-docs

springdoc.swagger-ui.config-url=/v3/api-docs/swagger-config
springdoc.swagger-ui.supported-submit-methods=["get", "post", "put", "delete", "patch"]
springdoc.swagger-ui.filter=true
springdoc.api-docs.groups.enabled=true

# Management / Actuator
management.endpoints.web.exposure.include=health,info,metrics,tracing,refresh,gateway
management.endpoint.health.show-details=always

# =========================
# ZADATAK 3 - INSTANCE ID
# =========================
instance.id=${INSTANCE_ID:${HOSTNAME:gateway-local}}

# =========================
# ZADATAK 3 - EUREKA / LOAD BALANCING
# =========================
eureka.client.service-url.defaultZone=${EUREKA_URL:http://discovery-service:8761/eureka}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${instance.id}

spring.cloud.loadbalancer.ribbon.enabled=false

# =========================
# ZADATAK 3 - W3C TRACING
# =========================
management.tracing.enabled=true
management.tracing.propagation.type=w3c
management.tracing.sampling.probability=1.0
management.observations.http.server.requests.enabled=true

# =========================
# ZADATAK 3 - LOGGING
# =========================
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [service=gateway-service] [instance=${instance.id}] [traceId=%X{traceId}] %logger{36} - %msg%n

# Adresa na kojoj se nalazi Zipkin server u Dockeru
management.zipkin.tracing.endpoint=http://zipkin:9411/api/v2/spans
# Formatiranje logova u konzoli da prikazuju [ime-servisa, traceId, spanId]
logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]
management.tracing.web.enabled=true

# Dozvola za kreiranje opservacija za HTTP zahteve
# Slanje logova u Loki (Loki radi unutar Docker mre?e na portu 3100)
loki.url=http://loki:3100/loki/api/v1/push

