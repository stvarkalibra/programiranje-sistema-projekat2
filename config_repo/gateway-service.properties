server.port=8080

spring.cloud.gateway.server.webflux.routes[0].id=accommodation-service
spring.cloud.gateway.server.webflux.routes[0].uri=http://localhost:8081
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/accommodation/**
spring.cloud.gateway.server.webflux.routes[0].filters[0]=RewritePath=/api/accommodation/(?<segment>.*), /${segment}

spring.cloud.gateway.server.webflux.routes[1].id=maintenance-service
spring.cloud.gateway.server.webflux.routes[1].uri=http://localhost:8082
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/maintenance/**
spring.cloud.gateway.server.webflux.routes[1].filters[0]=RewritePath=/api/maintenance/(?<segment>.*), /${segment}

spring.cloud.gateway.server.webflux.routes[2].id=booking-service
spring.cloud.gateway.server.webflux.routes[2].uri=http://localhost:8083
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/booking/**
spring.cloud.gateway.server.webflux.routes[2].filters[0]=RewritePath=/api/booking/(?<segment>.*), /${segment}

spring.cloud.gateway.server.webflux.routes[3].id=finances-service
spring.cloud.gateway.server.webflux.routes[3].uri=http://localhost:8084
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/finances/**
spring.cloud.gateway.server.webflux.routes[3].filters[0]=RewritePath=/api/finances/(?<segment>.*), /${segment}

spring.cloud.gateway.server.webflux.routes[4].id=guide-service
spring.cloud.gateway.server.webflux.routes[4].uri=http://localhost:8087
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/guides/**,/api/languages/**,/api/guide-languages/**,/api/certifications/**

spring.cloud.gateway.server.webflux.routes[5].id=avantura-service
spring.cloud.gateway.server.webflux.routes[5].uri=http://localhost:8088
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/api/adventures/**,/api/reviews/**,/api/categories/**,/api/gear/**,/api/time-slots/**

spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedOrigins=*
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedMethods=*
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedHeaders=*

springdoc.swagger-ui.urls[0].name=Accommodation Service
springdoc.swagger-ui.urls[0].url=/api/accommodation/v3/api-docs
springdoc.swagger-ui.urls[1].name=Maintenance Service
springdoc.swagger-ui.urls[1].url=/api/maintenance/v3/api-docs
springdoc.swagger-ui.urls[2].name=Booking Service
springdoc.swagger-ui.urls[2].url=/api/booking/v3/api-docs
springdoc.swagger-ui.urls[3].name=Finances Service
springdoc.swagger-ui.urls[3].url=/api/finances/v3/api-docs
springdoc.swagger-ui.urls[4].name=Guide Service
springdoc.swagger-ui.urls[4].url=/api/guides/v3/api-docs
springdoc.swagger-ui.urls[5].name=Adventure Service
springdoc.swagger-ui.urls[5].url=/api/adventures/v3/api-docs

management.endpoints.web.exposure.include=health,info,refresh