server.port=8081

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:accommodationdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

springdoc.swagger-ui.server-url=http://localhost:8080/api/accommodation

management.endpoints.web.exposure.include=health,info,circuitbreakers
management.health.circuitbreakers.enabled=true

logging.pattern.console=%d{HH:mm:ss} [%X{traceId}] %-5level %logger{36} - %msg%n