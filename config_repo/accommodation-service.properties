server.port=8081

spring.datasource.url=jdbc:h2:mem:accommodationdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

springdoc.swagger-ui.server-url=http://localhost:8080/api/accommodation

management.endpoints.web.exposure.include=health,info,circuitbreakers
management.health.circuitbreakers.enabled=true

logging.pattern.console=%d{HH:mm:ss} [%X{traceId}] %-5level %logger{36} - %msg%n