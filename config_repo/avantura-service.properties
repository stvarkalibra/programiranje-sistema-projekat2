server.port=${SERVER_PORT:8088}

springdoc.api-docs.path=/api/adventures/v3/api-docs

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/eco_tourism_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true

spring.sql.init.mode=${SPRING_SQL_INIT_MODE:never}

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.server.url=${GATEWAY_URL:http://localhost:8080}

management.endpoints.web.exposure.include=health,info,refresh

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [%X{traceId}] %logger{36} - %msg%n

server.forward-headers-strategy=framework