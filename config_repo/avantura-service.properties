server.port=${SERVER_PORT:8088}

springdoc.api-docs.enabled=true
springdoc.api-docs.path=/api/adventures/v3/api-docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.server.url=${GATEWAY_URL:http://localhost:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/eco_tourism_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=false

spring.sql.init.mode=never

# RabbitMQ
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:rabbitmq}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:guest}
spring.rabbitmq.dynamic=true

# Management / Actuator
management.endpoints.web.exposure.include=health,info,metrics,refresh
management.endpoint.health.show-details=always
management.health.db.enabled=true
management.health.diskspace.enabled=true
management.endpoint.health.probes.enabled=true

# Forward headers
server.forward-headers-strategy=framework

# =========================
# ZADATAK 3 - INSTANCE ID
# =========================
instance.id=${INSTANCE_ID:${HOSTNAME:avantura-local}}

# =========================
# ZADATAK 3 - EUREKA CLIENT
# =========================
eureka.client.service-url.defaultZone=${EUREKA_URL:http://discovery-service:8761/eureka}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${instance.id}

# =========================
# ZADATAK 3 - LOAD BALANCING
# =========================
spring.cloud.loadbalancer.ribbon.enabled=false

# =========================
# ZADATAK 3 - W3C TRACING
# =========================
management.tracing.enabled=true
management.tracing.propagation.type=w3c
management.tracing.sampling.probability=1.0
management.observations.http.server.requests.enabled=true

# =========================
# ZADATAK 3 - LOGGING
# =========================
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [service=%X{serviceName}] [instance=%X{instanceId}] [traceId=%X{traceId}] %logger{36} - %msg%n