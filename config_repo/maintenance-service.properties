server.port=${SERVER_PORT:8082}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/eco_tourism_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=false

spring.sql.init.mode=never

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.server.url=${GATEWAY_URL:http://localhost:8080}

accommodation.service.url=${ACCOMMODATION_SERVICE_URL:http://accommodation-service:8081}

resilience4j.circuitbreaker.instances.accommodationService.sliding-window-size=10
resilience4j.circuitbreaker.instances.accommodationService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.accommodationService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.accommodationService.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.accommodationService.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.accommodationService.register-health-indicator=true

resilience4j.retry.instances.accommodationService.max-attempts=3
resilience4j.retry.instances.accommodationService.wait-duration=2s
resilience4j.retry.instances.accommodationService.retry-exceptions=java.io.IOException,java.lang.RuntimeException

management.endpoints.web.exposure.include=health,info,circuitbreakers,retries,refresh
management.endpoint.health.show-details=always
management.health.circuitbreakers.enabled=true

logging.pattern.console=%d{HH:mm:ss} [%X{traceId}] %-5level %logger{36} - %msg%n

server.forward-headers-strategy=framework

# RabbitMQ
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:rabbitmq}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:guest}
spring.rabbitmq.connection-timeout=5000