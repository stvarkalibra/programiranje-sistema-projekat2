spring.application.name=finances-service
server.port=${SERVER_PORT:8084}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/eco_tourism_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
#spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=false

spring.sql.init.mode=never

server.error.include-message=always
server.error.include-stacktrace=never
server.error.include-binding-errors=always

#springdoc.api-docs.path=/api/finances/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.server.url=${GATEWAY_URL:http://localhost:8080}
springdoc.api-docs.groups.enabled=true

management.endpoints.web.exposure.include=health,circuitbreakers,refresh
management.health.circuitbreakers.enabled=true
management.endpoints.web.cors.allowed-origins=${GATEWAY_URL:http://localhost:8080}
management.endpoints.web.cors.allowed-methods=GET,POST,PUT,DELETE

logging.level.io.github.resilience4j=DEBUG
logging.level.io.github.resilience4j.circuitbreaker=DEBUG
logging.level.org.springframework.cloud.openfeign=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level [traceId=%X{traceId}] %logger{36} - %msg%n

resilience4j.circuitbreaker.instances.bookingServiceCB.register-health-indicator=true
resilience4j.circuitbreaker.instances.bookingServiceCB.sliding-window-size=10
resilience4j.circuitbreaker.instances.bookingServiceCB.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.bookingServiceCB.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.bookingServiceCB.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.bookingServiceCB.ignore-exceptions=org.example.finansijeservice.exception.ConflictException,org.example.finansijeservice.exception.BadRequestException,org.example.finansijeservice.exception.ResourceNotFoundException,org.springframework.web.server.ResponseStatusException

resilience4j.ratelimiter.instances.basicLimit.limit-for-period=5
resilience4j.ratelimiter.instances.basicLimit.limit-refresh-period=10s
resilience4j.ratelimiter.instances.basicLimit.timeout-duration=1000ms

server.forward-headers-strategy=framework

# Adresa RabbitMQ servisa (ime servisa iz docker-compose fajla)
spring.rabbitmq.host=rabbitmq
# Standardni port za AMQP protokol
spring.rabbitmq.port=5672
# Kredencijali (default vrednosti za RabbitMQ sliku)
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Opciono: Omogu?ava automatsko kreiranje definisanih Queue-ova i Exchange-a pri startu
spring.rabbitmq.dynamic=true

# sampling zahteva
management.tracing.sampling.probability=1.0
# Adresa na kojoj se nalazi Zipkin server u Dockeru
management.zipkin.tracing.endpoint=http://zipkin:9411/api/v2/spans
# Formatiranje logova u konzoli da prikazuju [ime-servisa, traceId, spanId]
logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]
loki.url=http://loki:3100/loki/api/v1/push

management.tracing.propagation.type=w3c
spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=DEBUG
management.endpoint.health.show-details=always

eureka.client.serviceUrl.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
spring.cloud.discovery.enabled=true
springdoc.api-docs.path=/api/finances/v3/api-docs
