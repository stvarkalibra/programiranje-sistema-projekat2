# Zajednicki defaults za sve servise

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=false
spring.jpa.properties.hibernate.format_sql=true

# Podatke unosimo preko Adminer-a/MySQL-a.
# Ne pokrecemo automatski import.sql za sve servise.
spring.sql.init.mode=never

management.endpoint.health.show-details=always
management.endpoints.web.exposure.include=health,info,metrics,refresh
management.endpoints.web.cors.allowed-origins=http://localhost:8080
management.endpoints.web.cors.allowed-methods=GET,POST,PUT,DELETE

springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level [traceId=%X{traceId}] %logger{36} - %msg%n